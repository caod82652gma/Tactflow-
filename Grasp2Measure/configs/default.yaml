data:
  tactile_root: ../Workspace/C_model_training/tactile
  split_root: splits/tactile
  interpolation: idw4
  train_split: train
  val_split: val
  test_split: test
  max_frames_per_trial: null

labels:
  # These are container models, not liquid-volume labels.
  class_order: ["15ml", "50ml", "100ml", "200ml"]
  radius_mm:
    15ml: 7.5
    50ml: 20.0
    100ml: 25.0
    200ml: 30.0

features:
  input_mode: tactile_summary
  sensor_coordinates_csv: configs/gripper_sensor_coordinates.csv
  # Used only by the optional hand-crafted pressure feature extractor.
  # The default tactile classifier below uses one stable frame per trial.
  contact_threshold_mv: 50.0
  # stable_frame: find the adjacent frame pair with the smallest normalized
  # multi-channel motion, then use the first frame in that stable pair.
  # Alternatives: stable_pair_mean, mean, mean_std.
  tactile_summary: stable_frame
  thermal_columns: ["AD1_Temperature_mV", "AD2_Temperature_mV", "AD3_Temperature_mV", "AD4_Temperature_mV", "AD5_Temperature_mV", "AD6_Temperature_mV", "AD7_Temperature_mV", "AD8_Temperature_mV"]
  # Maps each temperature channel to a tactile contact column index for soft attention.
  thermal_contact_columns: [1, 2, 3, 4, 5, 6, 3, 4]

model:
  hidden_dim: 16
  dropout: 0.1

train:
  batch_size: 256
  epochs: 80
  learning_rate: 0.001
  weight_decay: 0.0001
  output_dir: runs/default
  device: auto

wandb:
  entity: davyfangyuxuan-nanjing-university-of-aeronautics-and-ast
  project: VET6_tactile_model
  mode: online
  group: tactile_container
  job_type: train
  tags: ["tactile", "container-classification"]
